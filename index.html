<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<title>Minha TV</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --fg:#eceef2; --muted:#8b93a1; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px system-ui,sans-serif; }
  #top { position:sticky; top:0; z-index:5; background:var(--bg); }
  header { background:var(--bg); padding:10px 16px; }
  #player { position:relative; }
  video { width:100%; max-height:40vh; background:#000; display:block; }
  #player:fullscreen video { max-height:none; height:100%; }
  #bar { display:flex; align-items:center; gap:8px; padding:0 16px; }
  #bar #status { flex:1; padding:6px 0; }
  #fs, #fit { white-space:nowrap; }
  #fs { background:var(--accent); border-color:var(--accent); font-weight:600; }
  #status { color:var(--muted); font-size:13px; padding:6px 16px; min-height:28px; }
  input, button { font:inherit; color:var(--fg); background:var(--card); border:1px solid #2a2f3a; border-radius:8px; padding:10px; }
  #q { width:100%; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row input { flex:1; min-width:0; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  #groups { display:flex; gap:8px; overflow-x:auto; padding:0 16px 10px; scrollbar-width:none; }
  #groups::-webkit-scrollbar { display:none; }
  #groups button { white-space:nowrap; padding:6px 14px; border-radius:999px; flex:none; }
  #groups button.on { background:var(--accent); border-color:var(--accent); }
  ul { list-style:none; margin:0; padding:0 16px 24px; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  li { display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; background:var(--card); border-radius:10px; padding:10px 6px; cursor:pointer; min-width:0; }
  li.on { outline:2px solid var(--accent); }
  li img { width:64px; height:64px; object-fit:contain; background:#fff1; border-radius:6px; }
  li div { width:100%; min-width:0; }
  li span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  li small { color:var(--muted); display:block; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<div id="top">
<div id="player"><video id="v" controls playsinline autoplay></video></div>
<div id="bar">
  <div id="status">Carregando canais…</div>
  <button id="fit">Normal</button>
  <button id="fs">⛶ Tela cheia</button>
</div>
</div>
<header>
  <input id="q" type="search" placeholder="Buscar canal">
  <div class="row">
    <input id="url" type="url" placeholder="URL de uma lista M3U">
    <button id="load" class="primary">Carregar</button>
  </div>
</header>
<div id="groups"></div>
<ul id="list"></ul>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const DEFAULT_LIST = 'https://iptv-org.github.io/iptv/countries/br.m3u';
const $ = id => document.getElementById(id);
const video = $('v'), statusEl = $('status'), listEl = $('list');
let channels = [], hls = null, curGroup = 'Todos';
const GROUP_PT = { General:'Geral', Entertainment:'Entretenimento', Movies:'Filmes', Undefined:'Outros', News:'Notícias',
  Series:'Séries', Religious:'Religião', Infantil:'Infantil', Music:'Música', Education:'Educação', Comedy:'Comédia',
  Documentary:'Documentários', Culture:'Cultura', Classic:'Clássicos', Animation:'Animação', Sports:'Esportes',
  Outdoor:'Campo e natureza', Lifestyle:'Estilo de vida', Legislative:'Legislativo', Family:'Família', Cooking:'Culinária',
  Auto:'Automotivo', Public:'Público', Kids:'Infantil' };
const groupsOf = c => (c.group || 'Undefined').split(';').map(g => GROUP_PT[g] || g);

function parseM3U(text) {
  const out = [], lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].startsWith('#EXTINF')) continue;
    const info = lines[i];
    const name = (info.split(',').pop() || '').trim();
    const logo = (info.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
    const group = (info.match(/group-title="([^"]*)"/) || [])[1] || '';
    let j = i + 1;
    while (j < lines.length && (!lines[j].trim() || lines[j].startsWith('#'))) j++;
    const url = (lines[j] || '').trim();
    if (/^https?:/i.test(url)) out.push({ name, logo, group, url });
  }
  return out;
}

function renderGroups() {
  const n = {};
  channels.forEach(c => new Set(groupsOf(c)).forEach(g => n[g] = (n[g] || 0) + 1));
  const names = Object.keys(n).sort((a, b) => (a === 'Infantil' ? -1 : b === 'Infantil' ? 1 : n[b] - n[a]));
  if (curGroup !== 'Todos' && !n[curGroup]) curGroup = 'Todos';
  const box = $('groups'); box.innerHTML = '';
  [['Todos', channels.length], ...names.map(g => [g, n[g]])].forEach(([g, k]) => {
    const b = document.createElement('button');
    b.textContent = g + ' (' + k + ')';
    b.className = g === curGroup ? 'on' : '';
    b.onclick = () => { curGroup = g; renderGroups(); render(); };
    box.appendChild(b);
  });
}

function render() {
  const q = $('q').value.toLowerCase();
  listEl.innerHTML = '';
  channels.filter(c => c.name.toLowerCase().includes(q) && (curGroup === 'Todos' || groupsOf(c).includes(curGroup))).forEach(c => {
    const li = document.createElement('li');
    li.dataset.url = c.url;
    li.innerHTML = '<img alt="" loading="lazy"><div><span></span><small></small></div>';
    li.querySelector('img').src = c.logo;
    li.querySelector('img').onerror = e => e.target.style.visibility = 'hidden';
    li.querySelector('span').textContent = c.name;
    li.querySelector('small').textContent = groupsOf(c).join(' · ');
    li.onclick = () => play(c, li);
    listEl.appendChild(li);
  });
}

function play(c, li) {
  document.querySelectorAll('li.on').forEach(e => e.classList.remove('on'));
  li && li.classList.add('on');
  statusEl.textContent = 'Abrindo ' + c.name + '…';
  if (hls) { hls.destroy(); hls = null; }
  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(c.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); statusEl.textContent = c.name; });
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) statusEl.textContent = 'Canal fora do ar ou bloqueado: ' + c.name; });
  } else {
    video.src = c.url; // Safari/iOS toca HLS nativamente
    video.play().catch(() => {});
    statusEl.textContent = c.name;
  }
}

async function loadList(url) {
  statusEl.textContent = 'Carregando canais…';
  try {
    const r = await fetch(url);
    channels = parseM3U(await r.text());
    statusEl.textContent = channels.length + ' canais. Toque em um para assistir.';
    renderGroups();
    render();
  } catch (e) {
    statusEl.textContent = 'Não consegui carregar a lista (o servidor pode bloquear acesso pelo navegador).';
  }
}

$('q').oninput = render;
$('load').onclick = () => {
  if (!$('url').value) return;
  try { localStorage.setItem('custom', $('url').value); } catch {}
  loadList($('url').value);
};
let saved = null; try { saved = localStorage.getItem('custom'); } catch {}
$('url').value = saved || '';
// usa channels.m3u (gerado por check.py) se existir; senão cai na lista pública
fetch('channels.m3u', { method: 'HEAD' })
  .then(r => loadList(saved || (r.ok ? 'channels.m3u' : DEFAULT_LIST)))
  .catch(() => loadList(saved || DEFAULT_LIST));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
// tela cheia: botao, e gira para paisagem ao entrar (quando o aparelho permite)
$('fs').onclick = async () => {
  const p = $('player'), v = $('v');
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else if (p.requestFullscreen) {
    await p.requestFullscreen().catch(() => {});
    try { await screen.orientation.lock('landscape'); } catch (e) {}
  } else if (v.webkitEnterFullscreen) {
    v.webkitEnterFullscreen(); // iPhone
  }
};
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) { try { screen.orientation.unlock(); } catch (e) {} }
});
// formato da imagem: normal (com faixas), ampliar (corta) ou esticar
const FITS = [['Normal', 'contain'], ['Ampliar', 'cover'], ['Esticar', 'fill']];
let fitIdx = 0; try { fitIdx = +localStorage.getItem('fit') || 0; } catch (e) {}
const applyFit = () => { $('v').style.objectFit = FITS[fitIdx][1]; $('fit').textContent = FITS[fitIdx][0]; };
$('fit').onclick = () => {
  fitIdx = (fitIdx + 1) % FITS.length; applyFit();
  try { localStorage.setItem('fit', fitIdx); } catch (e) {}
};
applyFit();
</script>
</body>
</html>
