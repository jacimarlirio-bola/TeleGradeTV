name: Atualizar lista de canais

on:
  schedule:
    - cron: '0 9 * * 1'   # toda segunda-feira, 09:00 UTC
  workflow_dispatch:       # tambem pode rodar manualmente

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python atualizar.py
      - name: Salvar mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.m3u channels-http.m3u status.json
          git diff --cached --quiet || (git commit -m "Atualiza lista de canais" && git push)
